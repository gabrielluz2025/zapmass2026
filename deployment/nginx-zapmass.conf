# Configuração nginx para ZapMass
# Instalar: cp deployment/nginx-zapmass.conf /etc/nginx/sites-available/zapmass
#           ln -sf /etc/nginx/sites-available/zapmass /etc/nginx/sites-enabled/zapmass
#           rm -f /etc/nginx/sites-enabled/default
#           nginx -t && systemctl reload nginx

# Map para suportar upgrade HTTP→WS e requests normais no mesmo location.
# Sem este map, Connection "upgrade" em requests HTTP comuns quebra keep-alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name zap-mass.com www.zap-mass.com zap.mass.com www.zap.mass.com;

    # Tamanho máximo de upload (mídia WhatsApp via HTTP)
    client_max_body_size 100M;

    # Timeouts — import/lista grande e WebSocket idle (Socket.IO pinga a cada 25s).
    # 90s matava POST /contacts/bulk e append de lista → "Failed to fetch" no browser.
    proxy_connect_timeout       10s;
    proxy_send_timeout          300s;
    proxy_read_timeout          300s;

    # Keep-alive para o upstream Node.js (evita abrir nova TCP a cada request).
    # Deve ser < httpServer.keepAliveTimeout (80s) do Node.
    keepalive_timeout           75s;

    location / {
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;

        # WebSocket / Socket.IO — usa o map acima para não quebrar requests comuns.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Manter sockets TCP ativos entre nginx e Node (evita RST após idle).
        proxy_socket_keepalive on;

        # Headers padrão de proxy
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Sem buffering: essencial para WebSocket e streaming de eventos.
        proxy_buffering off;

        # Sem cache em respostas de API/WebSocket.
        proxy_cache off;
        add_header X-Accel-Buffering no;
    }
}
