# ZapMass — produção em Docker
#
# VPS (recomendado — instala Docker, .env, build e sobe):
#   sudo bash deployment/bootstrap-docker-vps.sh https://github.com/SEU_USUARIO/SEU_REPO.git
#
# Ou, com o código já na pasta:
#   sudo bash deployment/instalar-docker-servidor.sh
#
# Manual: cp .env.example .env, ajuste ALLOWED_ORIGINS e HOST_PORT, depois:
#   docker compose up -d --build
#
# GA4: com VITE_GA_MEASUREMENT_ID=G-… no `.env`, o `docker compose up --build` embute o gtag no bundle.
#
# Porta no host: HOST_PORT no .env (padrão 3001), só em 127.0.0.1 (Nginx faz o proxy público 80/443).
# Dados: volume zapmass-data → /app/data (sessão WhatsApp e filas persistem no servidor).
#
# Compose 2.24+: env_file com required:false. Em versões antigas: crie .env antes do up.

services:
  zapmass:
    build:
      context: .
      # VITE_* precisa estar disponivel no build do frontend (Vite "cozinha" no bundle).
      # Valores vem do .env da VPS via interpolacao do docker compose.
      args:
        VITE_ADMIN_EMAILS: ${VITE_ADMIN_EMAILS:-}
        VITE_ADMIN_UIDS: ${VITE_ADMIN_UIDS:-${ZAPMASS_ADMIN_UIDS:-}}
        VITE_ZAPMASS_ADMIN_UIDS: ${VITE_ZAPMASS_ADMIN_UIDS:-}
        VITE_MARKETING_PRICE_MONTHLY: ${VITE_MARKETING_PRICE_MONTHLY:-}
        VITE_MARKETING_PRICE_ANNUAL: ${VITE_MARKETING_PRICE_ANNUAL:-}
        VITE_ENFORCE_SUBSCRIPTION: ${VITE_ENFORCE_SUBSCRIPTION:-true}
        VITE_CREATOR_STUDIO: ${VITE_CREATOR_STUDIO:-}
        # Na VPS: `export VITE_GIT_REF=$(git rev-parse --short HEAD)` antes do up --build, ou o workflow de deploy define.
        VITE_GIT_REF: ${VITE_GIT_REF:-unknown}
        CACHEBUST: ${VITE_GIT_REF:-unknown}
        # GA4 opcional — incorporado no bundle pelo Vite (ver .env.example).
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_USE_VPS_AUTH: ${VITE_USE_VPS_AUTH:-true}
        VITE_USE_VPS_DATA: ${VITE_USE_VPS_DATA:-true}
    init: true
    ports:
      - "127.0.0.1:${HOST_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Alinhar com docker-stack: ZAPMASS_API_SESSION_MODE=api + profile workers para testar split local
      SESSION_PROCESS_MODE: ${ZAPMASS_API_SESSION_MODE:-monolith}
      # Repasse explícito (Compose lê o .env ao lado deste ficheiro para interpolar ${…}).
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_BACK_URL: ${MERCADOPAGO_BACK_URL:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      MERCADOPAGO_WEBHOOK_ALLOW_UNSIGNED: ${MERCADOPAGO_WEBHOOK_ALLOW_UNSIGNED:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN:-}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-zapmass-secure-key-2026}
      EVOLUTION_GO_URL: ${EVOLUTION_GO_URL:-http://evolution-go:8080}
      EVOLUTION_GO_KEY: ${EVOLUTION_GO_KEY:-${EVOLUTION_API_KEY:-zapmass-secure-key-2026}}
      ZAPMASS_WEBHOOK_URL: ${ZAPMASS_WEBHOOK_URL:-http://zapmass:3001/webhook/evolution}
      ZAPMASS_WHATSAPP_ENGINE: ${ZAPMASS_WHATSAPP_ENGINE:-evolution-go}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_PORT: ${S3_PORT:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SUGGESTION_NOTIFY_EMAIL: ${SUGGESTION_NOTIFY_EMAIL:-}
      NEW_CLIENT_NOTIFY_EMAIL: ${NEW_CLIENT_NOTIFY_EMAIL:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Credenciais Firebase Admin (service account). Coloca o JSON em
      # /opt/zapmass/secrets/firebase-admin.json no host (chmod 600).
      # Se o ficheiro nao existir, o servidor sobe na mesma mas rotas que
      # precisam de Firestore (trial, billing, admin) retornam 503.
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-admin.json
      # Auth VPS (sem clientes: pode usar vps). firebase | vps | dual
      ZAPMASS_AUTH_PROVIDER: ${ZAPMASS_AUTH_PROVIDER:-vps}
      ZAPMASS_DATA_PROVIDER: ${ZAPMASS_DATA_PROVIDER:-vps}
      ZAPMASS_DATABASE_URL: ${ZAPMASS_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-evolution-secure-pass-2026}@postgres:5432/zapmass_db}
      ZAPMASS_JWT_SECRET: ${ZAPMASS_JWT_SECRET:-}
      # Login funcionários (usuário/senha); ver .env.example
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
      MAX_STAFF_PASSWORD_ACCOUNTS: ${MAX_STAFF_PASSWORD_ACCOUNTS:-}
      SUBSCRIPTION_ENFORCE: ${SUBSCRIPTION_ENFORCE:-true}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ADMIN_UIDS: ${ADMIN_UIDS:-${ZAPMASS_ADMIN_UIDS:-}}
      ZAPMASS_ADMIN_UIDS: ${ZAPMASS_ADMIN_UIDS:-}
      WWEBJS_WEB_VERSION_URL: ${WWEBJS_WEB_VERSION_URL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
    env_file:
      - path: .env
        required: false
    volumes:
      - zapmass-data:/app/data
      - ./secrets:/run/secrets:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    shm_size: "2gb"
    # Da tempo para o Node/whatsapp-web.js fechar o Chromium com graca e
    # flushar a sessao no volume antes do SIGKILL (default seria 10s).
    # 45s = 15s per-client destroy + 5s backup + folga para o Node finalizar
    # e tirar backup de multiplas sessoes em paralelo.
    stop_grace_period: 45s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
      evolution-go:
        condition: service_started
        required: false

  evolution:
    profiles: ["evolution-api"]
    # Padrao: v2.3.7 (estavel). Override via EVOLUTION_IMAGE no .env (ex.: 2.4.0-rc2).
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    restart: unless-stopped
    # Antes os logs cresciam sem limite e podiam encher o disco da VPS.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-zapmass-secure-key-2026}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD:-evolution-secure-pass-2026}@postgres:5432/evolution_db?schema=public
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379/1
      - REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_LOCAL_ENABLED=false
      - WEBSOCKET_ENABLED=false
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=false
      - STORE_CONTACTS=true
      - STORE_CHATS=true
      - CONFIG_SESSION_PHONE_VERSION=${CONFIG_SESSION_PHONE_VERSION:-2.3000.1035712111}
      - CONFIG_SESSION_PHONE_CLIENT=${CONFIG_SESSION_PHONE_CLIENT:-ZapMass}
      - CONFIG_SESSION_PHONE_NAME=${CONFIG_SESSION_PHONE_NAME:-Chrome}
      # Reduz JID @lid sem telefone nos webhooks (quando suportado pela imagem Evolution).
      - WPP_LID_MODE=${WPP_LID_MODE:-false}
      - LOG_LEVEL=${EVOLUTION_LOG_LEVEL:-ERROR}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - zapmass-evolution:/evolution/instances
    depends_on:
      - redis
      - postgres

  # 2ª instância Evolution (shard) — ativar com EVOLUTION_SHARD_ENABLED=1 e:
  #   docker compose --profile evolution-shard up -d evolution-2
  # Ou: bash deployment/setup-evolution-shard.sh
  evolution-2:
    profiles: ["evolution-shard"]
    container_name: zapmass-evolution-2
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - SERVER_PORT=8080
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-zapmass-secure-key-2026}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD:-evolution-secure-pass-2026}@postgres:5432/evolution_db_2?schema=public
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379/4
      - REDIS_PREFIX_KEY=evolution2
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/4
      - CACHE_LOCAL_ENABLED=false
      - WEBSOCKET_ENABLED=false
      - STORE_MESSAGES=true
      - STORE_MESSAGE_UP=false
      - STORE_CONTACTS=true
      - STORE_CHATS=true
      - CONFIG_SESSION_PHONE_VERSION=${CONFIG_SESSION_PHONE_VERSION:-2.3000.1035712111}
      - CONFIG_SESSION_PHONE_CLIENT=${CONFIG_SESSION_PHONE_CLIENT:-ZapMass}
      - CONFIG_SESSION_PHONE_NAME=${CONFIG_SESSION_PHONE_NAME:-Chrome}
      - WPP_LID_MODE=${WPP_LID_MODE:-false}
      - LOG_LEVEL=${EVOLUTION_LOG_LEVEL:-ERROR}
      - NODE_OPTIONS=--dns-result-order=ipv4first
    volumes:
      - zapmass-evolution-2:/evolution/instances
    depends_on:
      - redis
      - postgres

  # Evolution Go (whatsmeow) — motor padrão do ZapMass.
  # Rollback Node/Baileys: ZAPMASS_WHATSAPP_ENGINE=evolution-api + profile evolution-api
  evolution-go:
    container_name: zapmass-evolution-go
    image: ${EVOLUTION_GO_IMAGE:-evoapicloud/evolution-go:latest}
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - SERVER_PORT=8080
      - CLIENT_NAME=zapmass
      - GLOBAL_API_KEY=${EVOLUTION_GO_KEY:-${EVOLUTION_API_KEY:-zapmass-secure-key-2026}}
      - POSTGRES_AUTH_DB=postgresql://postgres:${POSTGRES_PASSWORD:-evolution-secure-pass-2026}@postgres:5432/evogo_auth?sslmode=disable
      - POSTGRES_USERS_DB=postgresql://postgres:${POSTGRES_PASSWORD:-evolution-secure-pass-2026}@postgres:5432/evogo_users?sslmode=disable
      - DATABASE_SAVE_MESSAGES=false
      - WEBHOOK_URL=${ZAPMASS_WEBHOOK_URL:-http://zapmass:3001/webhook/evolution}
      - WADEBUG=${EVOLUTION_GO_WADEBUG:-INFO}
      - LOGTYPE=console
    healthcheck:
      # Evolution Go requer auth em todos os endpoints — 401 = servidor online (aceito como saudável).
      # GET / retorna 404, por isso usa /instance/all que retorna 200 ou 401 (ambos = online).
      # 200 ou 401 = servidor online (401 = auth requerida, mas rodando)
      test: ["CMD-SHELL", "wget -SO- http://127.0.0.1:8080/instance/all 2>&1 | grep -qE 'HTTP/[0-9.]+ (200|401)'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_buffers=256MB
      - -c
      - idle_in_transaction_session_timeout=120000
      - -c
      - idle_session_timeout=300000
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - POSTGRES_DB=evolution_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-evolution-secure-pass-2026}
    volumes:
      - zapmass-postgres:/var/lib/postgresql/data
      - ./deployment/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--appendfsync", "everysec",
      "--auto-aof-rewrite-percentage", "100",
      "--auto-aof-rewrite-min-size", "64mb",
      "--save", "60", "1000",
      # noeviction: BullMQ não pode perder chaves por LRU. Aumente REDIS_MAXMEMORY se OOM persistir.
      "--maxmemory", "${REDIS_MAXMEMORY:-2gb}",
      "--maxmemory-policy", "noeviction"
    ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    volumes:
      - zapmass-redis:/data

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: zapmass-uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3001"
    volumes:
      - zapmass-uptime-kuma:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wa-worker:
    build:
      context: .
      args:
        VITE_ADMIN_EMAILS: ${VITE_ADMIN_EMAILS:-}
        VITE_ADMIN_UIDS: ${VITE_ADMIN_UIDS:-${ZAPMASS_ADMIN_UIDS:-}}
        VITE_ZAPMASS_ADMIN_UIDS: ${VITE_ZAPMASS_ADMIN_UIDS:-}
        VITE_MARKETING_PRICE_MONTHLY: ${VITE_MARKETING_PRICE_MONTHLY:-}
        VITE_MARKETING_PRICE_ANNUAL: ${VITE_MARKETING_PRICE_ANNUAL:-}
        VITE_ENFORCE_SUBSCRIPTION: ${VITE_ENFORCE_SUBSCRIPTION:-true}
        VITE_CREATOR_STUDIO: ${VITE_CREATOR_STUDIO:-}
        VITE_GIT_REF: ${VITE_GIT_REF:-unknown}
        CACHEBUST: ${VITE_GIT_REF:-unknown}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_USE_VPS_AUTH: ${VITE_USE_VPS_AUTH:-true}
        VITE_USE_VPS_DATA: ${VITE_USE_VPS_DATA:-true}
    command: ["./node_modules/.bin/tsx", "server/waWorker.ts"]
    init: true
    # Imagem HEALTHCHECK usa :3001 (API); o worker não escuta HTTP.
    healthcheck:
      disable: true
    shm_size: "2gb"
    stop_grace_period: 60s
    environment:
      NODE_ENV: production
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SESSION_PROCESS_MODE: worker
      WORKER_ID: worker-compose
      WWEBJS_WEB_VERSION_URL: ${WWEBJS_WEB_VERSION_URL:-}
    env_file:
      - path: .env
        required: false
    volumes:
      - zapmass-data:/app/data
      - ./secrets:/run/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    profiles: ["workers"]

  # Backup diário automático do PostgreSQL (mantém 7 dias)
  pg-backup:
    image: alpine:3.19
    container_name: zapmass-pg-backup
    restart: unless-stopped
    environment:
      ZAPMASS_DATABASE_URL: ${ZAPMASS_DATABASE_URL:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - zapmass-pg-backups:/backups
      - ./deployment/backup-postgres.sh:/backup.sh:ro
    entrypoint: >
      sh -c "apk add --no-cache postgresql-client bash gzip &&
             chmod +x /backup.sh &&
             while true; do
               BACKUP_DIR=/backups /backup.sh;
               sleep 86400;
             done"
    depends_on:
      - postgres
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    profiles: ["backup"]

volumes:
  zapmass-data:
  zapmass-redis:
  zapmass-evolution:
  zapmass-evolution-2:
  zapmass-uptime-kuma:
  zapmass-pg-backups:
  # Nome fixo (legado Swarm). Sem external: compose cria se faltar e reutiliza se existir.
  zapmass-postgres:
    name: zapmass_zapmass-postgres
